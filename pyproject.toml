[project]
name = "quantum-computing"
version = "0.1.0"
description = "Order selection with QAOA: a Qiskit notebook comparing quantum and classical solvers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qiskit>=2.5.2",
    "qiskit-optimization",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "networkx",
    "matplotlib",
    "pylatexenc",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "nbdime",
    "ruff>=0.17.0",
]

[tool.uv]
# Notebook-only project: nothing to build or install as a package.
package = false
