[project]
name = "quantum-computing"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "qiskit>=2.5.2",
]

[project.scripts]
quantum-computing = "quantum_computing.main:main"
quantum-computing-benchmark = "quantum_computing.benchmark:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_computing"]
