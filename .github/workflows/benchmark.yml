name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
  pull_request:
    paths:
      - "src/**/*.py"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit hash to benchmark"
        required: false
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve checked-out commit
        id: resolve
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Prepare cache dir
        run: mkdir -p .benchmark-cache

      # Baseline priority 1: the previous benchmark on this same branch/ref.
      - name: Restore branch baseline
        id: restore-branch
        uses: actions/cache/restore@v4
        with:
          path: .benchmark-cache/baseline.json
          key: benchmark-${{ steps.resolve.outputs.ref }}-${{ steps.resolve.outputs.sha }}
          restore-keys: |
            benchmark-${{ steps.resolve.outputs.ref }}-

      - name: Check branch baseline
        id: check-branch
        run: |
          if [ -f .benchmark-cache/baseline.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Baseline priority 2: latest benchmark on main, when this branch has none yet.
      # No exact-match key is expected here; we only ever rely on the restore-keys
      # prefix fallback, so the primary key is written the same way to make that explicit.
      - name: Restore main baseline
        id: restore-main
        if: steps.check-branch.outputs.found == 'false' && steps.resolve.outputs.ref != 'main'
        uses: actions/cache/restore@v4
        with:
          path: .benchmark-cache/baseline.json
          key: benchmark-main-
          restore-keys: |
            benchmark-main-

      - name: Run benchmark
        run: uv run quantum-computing-benchmark --json .benchmark-cache/current.json

      - name: Tag current run with commit info
        run: |
          python - <<'EOF'
          import json

          with open(".benchmark-cache/current.json") as f:
              data = json.load(f)

          data["commit"] = "${{ steps.resolve.outputs.sha }}"
          data["ref"] = "${{ steps.resolve.outputs.ref }}"

          with open(".benchmark-cache/current.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Build job summary
        run: |
          if [ -f .benchmark-cache/baseline.json ]; then
            BASELINE_ARGS="--baseline .benchmark-cache/baseline.json"
          else
            BASELINE_ARGS=""
          fi
          python .github/scripts/compare_benchmark.py \
            --current .benchmark-cache/current.json \
            $BASELINE_ARGS \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            >> "$GITHUB_STEP_SUMMARY"

      # Save this run's result so later runs on this branch can use it as their baseline.
      - name: Save benchmark cache
        run: cp .benchmark-cache/current.json .benchmark-cache/baseline.json

      - uses: actions/cache/save@v4
        with:
          path: .benchmark-cache/baseline.json
          key: benchmark-${{ steps.resolve.outputs.ref }}-${{ steps.resolve.outputs.sha }}
