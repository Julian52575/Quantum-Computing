name: Benchmark cache cleanup

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete benchmark caches older than 2 months
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '2 months ago' +%s)

          gh cache list --repo "${{ github.repository }}" --key benchmark- --limit 100 --json id,key,createdAt \
            | jq -c '.[]' | while read -r entry; do
              created=$(echo "$entry" | jq -r '.createdAt')
              created_ts=$(date -u -d "$created" +%s)
              if [ "$created_ts" -lt "$cutoff" ]; then
                id=$(echo "$entry" | jq -r '.id')
                key=$(echo "$entry" | jq -r '.key')
                echo "Deleting cache '$key' (created $created)"
                gh cache delete "$id" --repo "${{ github.repository }}"
              fi
            done
